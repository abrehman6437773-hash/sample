<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_memory-3.svg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0728" />
      <stop offset="50%" stop-color="#3C096C" />
      <stop offset="100%" stop-color="#080314" />
    </linearGradient>
    <radialGradient id="halo_memory-3.svg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E0AAFF" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#3C096C" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="450" rx="24" fill="url(#bgGrad_memory-3.svg)" />
  
  <!-- Subtle Constellation Lines -->
  <circle cx="300" cy="215" r="160" fill="none" stroke="#E0AAFF" stroke-width="1.2" stroke-dasharray="4,8" opacity="0.25" />
  <circle cx="300" cy="215" r="110" fill="none" stroke="#FFB6D9" stroke-width="1" stroke-dasharray="2,6" opacity="0.3" />
  
  <!-- Central Soft Halo -->
  <circle cx="300" cy="215" r="115" fill="url(#halo_memory-3.svg)" />

  <!-- Symbol Graphic -->
  
        <path d="M340,130 C270,140 220,190 230,260 C240,310 290,340 340,330 C280,330 240,290 240,225 C240,165 285,135 340,130 Z" fill="#F8FAFC" filter="url(#glow)" />
        <polygon points="360,180 365,195 380,200 365,205 360,220 355,205 340,200 355,195" fill="#FFD166" filter="url(#glow)" />
      

  <!-- Label Badge -->
  <rect x="80" y="360" width="440" height="60" rx="18" fill="#0D061A" fill-opacity="0.75" stroke="#E0AAFF" stroke-width="1" stroke-opacity="0.35" />
  <text x="300" y="386" text-anchor="middle" font-family="'Cinzel', 'Playfair Display', serif" font-weight="700" font-size="16" fill="#FFFFFF" letter-spacing="3">CRESCENT WHISPERS</text>
  <text x="300" y="406" text-anchor="middle" font-family="'Poppins', sans-serif" font-weight="300" font-size="12" fill="#D8B4E2" letter-spacing="0.8">Graceful wishes sent to the silver night</text>
</svg>