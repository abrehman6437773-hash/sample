<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_memory-6.svg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#130924" />
      <stop offset="50%" stop-color="#7209B7" />
      <stop offset="100%" stop-color="#080314" />
    </linearGradient>
    <radialGradient id="halo_memory-6.svg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFCCD5" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#7209B7" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="450" rx="24" fill="url(#bgGrad_memory-6.svg)" />
  
  <!-- Subtle Constellation Lines -->
  <circle cx="300" cy="215" r="160" fill="none" stroke="#FFCCD5" stroke-width="1.2" stroke-dasharray="4,8" opacity="0.25" />
  <circle cx="300" cy="215" r="110" fill="none" stroke="#FFB6D9" stroke-width="1" stroke-dasharray="2,6" opacity="0.3" />
  
  <!-- Central Soft Halo -->
  <circle cx="300" cy="215" r="115" fill="url(#halo_memory-6.svg)" />

  <!-- Symbol Graphic -->
  
        <rect x="230" y="215" width="140" height="65" rx="12" fill="#C8B6FF" filter="url(#glow)" />
        <rect x="250" y="165" width="100" height="50" rx="8" fill="#FFB6D9" />
        <path d="M250,175 Q262,190 275,175 Q287,190 300,175 Q312,190 325,175 Q337,190 350,175" stroke="#FFFFFF" stroke-width="4" fill="none" stroke-linecap="round" />
        <rect x="296" y="130" width="8" height="35" rx="4" fill="#FFFFFF" />
        <path d="M300,110 C290,125 292,130 300,135 C308,130 310,125 300,110 Z" fill="#FFB703" filter="url(#glow)" />
      

  <!-- Label Badge -->
  <rect x="80" y="360" width="440" height="60" rx="18" fill="#0D061A" fill-opacity="0.75" stroke="#FFCCD5" stroke-width="1" stroke-opacity="0.35" />
  <text x="300" y="386" text-anchor="middle" font-family="'Cinzel', 'Playfair Display', serif" font-weight="700" font-size="16" fill="#FFFFFF" letter-spacing="3">CELEBRATION OF YOU</text>
  <text x="300" y="406" text-anchor="middle" font-family="'Poppins', sans-serif" font-weight="300" font-size="12" fill="#D8B4E2" letter-spacing="0.8">Another wonderful chapter of brilliance</text>
</svg>